<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>

    {# Google Fonts #}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        {{ css_variables }}

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-font_family_main, 'Noto Serif SC', serif);
            background-color: var(--color-background, #0b0b0b);
            color: var(--color-text_primary, #e8e8e8);
            line-height: var(--font-line_height, 1.8);
            letter-spacing: var(--font-letter_spacing, 0.02em);
        }

        .document-container {
            max-width: 900px;
            margin: 0 auto;
            padding: var(--spacing-page_padding, 80px);
            min-height: 100vh;
        }

        /* 标题样式 */
        .heading {
            margin-top: var(--spacing-heading_margin, 48px);
            margin-bottom: calc(var(--spacing-heading_margin, 48px) * 0.6);
            font-weight: 600;
            line-height: 1.3;
        }

        .heading-1 {
            font-size: 2.5rem;
            color: var(--color-text_primary, #e8e8e8);
            letter-spacing: 0.05em;
        }

        .heading-1.main-title {
            font-size: 3.2rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--color-accent, #c41e3a);
            font-family: var(--font-font_family_display, 'Noto Serif SC', serif);
            border-bottom: 1px solid var(--color-border, #2a2a2a);
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }

        .heading-2 {
            font-size: 1.8rem;
            margin-top: 3rem;
        }

        .heading-3 {
            font-size: 1.4rem;
            margin-top: 2rem;
            color: var(--color-text_secondary, #888888);
        }

        /* 段落样式 */
        .paragraph {
            margin-bottom: var(--spacing-paragraph_margin, 24px);
            text-align: justify;
        }

        .paragraph.important {
            color: var(--color-accent, #c41e3a);
            font-weight: 500;
            padding-left: 1rem;
            border-left: 2px solid var(--color-accent_secondary, #ff4757);
        }

        /* 引用块样式 */
        .quote {
            background: var(--color-quote_background, #1a1a1a);
            border-left: 4px solid var(--color-accent, #c41e3a);
            padding: var(--spacing-quote_padding, 32px);
            margin: var(--spacing-section_margin, 40px) 0;
            position: relative;
        }

        .quote-decoration {
            position: absolute;
            top: 0;
            left: 0;
        }

        .quote-content {
            font-style: italic;
            color: var(--color-text_secondary, #888888);
            font-size: 1.1em;
        }

        /* 代码块样式 */
        .code-block {
            background: var(--color-background_secondary, #141414);
            border: 1px solid var(--color-border, #2a2a2a);
            border-radius: var(--decor-border_radius, 4px);
            padding: 1.5rem;
            margin: 2rem 0;
            overflow-x: auto;
        }

        .code-block code {
            font-family: var(--font-font_family_code, 'JetBrains Mono', monospace);
            font-size: 0.9rem;
            color: var(--color-text_primary, #e8e8e8);
        }

        /* 列表样式 */
        .list {
            margin: 1.5rem 0;
            padding-left: 2rem;
        }

        .list li {
            margin-bottom: 0.75rem;
            color: var(--color-text_primary, #e8e8e8);
        }

        .list li::marker {
            color: var(--color-accent, #c41e3a);
        }

        /* 分隔线 */
        .divider {
            text-align: center;
            margin: 3rem 0;
        }

        /* 标题装饰 */
        .title-decorator {
            margin-bottom: 3rem;
        }

        /* 打印样式 */
        @media print {
            body {
                background: white;
                color: black;
            }

            .document-container {
                max-width: 100%;
                padding: 20mm;
            }
        }
    </style>

    <style>
        {{ theme_css }}
    </style>
</head>
<body>
    <article class="document-container">
        {% if title_svg %}
        <header class="document-header">
            <div class="title-svg">{{ title_svg | safe }}</div>
        </header>
        {% endif %}

        <main class="document-content">
            {{ content | safe }}
        </main>

        {% if metadata %}
        <footer class="document-footer">
            <small class="metadata">{{ metadata | tojson }}</small>
        </footer>
        {% endif %}
    </article>
</body>
</html>
