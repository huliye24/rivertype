<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>

    {# Google Fonts #}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">

    <style>
        {{ css_variables }}

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-font_family_main, 'Inter', sans-serif);
            background-color: var(--color-background, #0a0a0a);
            color: var(--color-text_primary, #ffffff);
            line-height: var(--font-line_height, 1.6);
            letter-spacing: var(--font-letter_spacing, 0.01em);
        }

        .document-container {
            max-width: 850px;
            margin: 0 auto;
            padding: var(--spacing-page_padding, 48px);
            min-height: 100vh;
        }

        /* 标题样式 */
        .heading {
            margin-top: var(--spacing-heading_margin, 48px);
            margin-bottom: calc(var(--spacing-heading_margin, 48px) * 0.5);
            font-weight: 600;
            line-height: 1.2;
        }

        .heading-1 {
            font-size: 2.2rem;
            color: var(--color-text_primary, #ffffff);
        }

        .heading-1.main-title {
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--color-accent, #ff1744);
            font-weight: 700;
            font-family: var(--font-font_family_display, 'Inter', sans-serif);
            text-shadow: 0 0 30px rgba(255, 23, 68, 0.5), 0 0 60px rgba(255, 23, 68, 0.3);
            margin-bottom: 2.5rem;
        }

        .heading-2 {
            font-size: 1.6rem;
            margin-top: 2.5rem;
            color: var(--color-text_primary, #ffffff);
        }

        .heading-3 {
            font-size: 1.2rem;
            margin-top: 2rem;
            color: var(--color-accent, #ff1744);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* 段落样式 */
        .paragraph {
            margin-bottom: var(--spacing-paragraph_margin, 24px);
        }

        .paragraph.important {
            color: var(--color-accent, #ff1744);
            font-weight: 500;
            text-shadow: 0 0 10px rgba(255, 23, 68, 0.3);
        }

        /* 引用块样式 */
        .quote {
            background: var(--color-quote_background, #151515);
            border-left: 4px solid var(--color-accent, #ff1744);
            padding: var(--spacing-quote_padding, 32px);
            margin: var(--spacing-section_margin, 32px) 0;
            position: relative;
            box-shadow: 0 0 20px rgba(255, 23, 68, 0.1);
        }

        .quote-decoration {
            position: absolute;
            top: 0;
            left: 0;
        }

        .quote-content {
            font-style: italic;
            color: var(--color-text_secondary, #cccccc);
            font-size: 1.1em;
            font-weight: 300;
        }

        /* 代码块样式 */
        .code-block {
            background: var(--color-background_secondary, #111111);
            border: 1px solid var(--color-border, #222222);
            border-left: 3px solid var(--color-accent, #ff1744);
            padding: 1.5rem;
            margin: 2rem 0;
            overflow-x: auto;
        }

        .code-block code {
            font-family: var(--font-font_family_code, 'JetBrains Mono', monospace);
            font-size: 0.85rem;
            color: var(--color-text_primary, #ffffff);
        }

        /* 列表样式 */
        .list {
            margin: 1.5rem 0;
            padding-left: 2rem;
        }

        .list li {
            margin-bottom: 0.75rem;
            color: var(--color-text_primary, #ffffff);
            position: relative;
        }

        .list li::marker {
            color: var(--color-accent, #ff1744);
        }

        /* 分隔线 */
        .divider {
            text-align: center;
            margin: 3rem 0;
            opacity: 0.5;
        }

        /* 标题装饰 */
        .title-decorator {
            margin-bottom: 3rem;
        }

        /* 动画 */
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 30px rgba(255, 23, 68, 0.5); }
            50% { text-shadow: 0 0 50px rgba(255, 23, 68, 0.8), 0 0 80px rgba(255, 23, 68, 0.4); }
        }

        .heading-1.main-title {
            animation: glow 3s ease-in-out infinite;
        }

        /* 打印样式 */
        @media print {
            body {
                background: white;
                color: black;
            }

            .heading-1.main-title {
                color: #ff1744;
                text-shadow: none;
            }
        }
    </style>

    <style>
        {{ theme_css }}
    </style>
</head>
<body>
    <article class="document-container">
        {% if title_svg %}
        <header class="document-header">
            <div class="title-svg">{{ title_svg | safe }}</div>
        </header>
        {% endif %}

        <main class="document-content">
            {{ content | safe }}
        </main>

        {% if metadata %}
        <footer class="document-footer">
            <small class="metadata">{{ metadata | tojson }}</small>
        </footer>
        {% endif %}
    </article>
</body>
</html>
